<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f0f5fc">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="hi there delilah ❀ here's little html viewer made exclusively just for you.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="little viewer ❀">
  <meta property="og:description" content="hi there delilah ❀ here's little html viewer made exclusively just for you.">
  <meta property="og:image" content="./assets/images/thumbnail.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="hi there delilah ❀ — pastel blue little viewer card">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="little viewer ❀">
  <meta name="twitter:description" content="hi there delilah ❀ here's little html viewer made exclusively just for you.">
  <meta name="twitter:image" content="./assets/images/thumbnail.jpg">
  <title>little viewer</title>
  <link rel="icon" href="assets/icons/code.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icons/touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="assets/css/style.css?v=1.3.0">
  <script>
    try {
      const theme = localStorage.getItem('little-viewer-theme');
      document.documentElement.dataset.theme = theme === 'light' || theme === 'dark'
        ? theme : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    } catch {
      document.documentElement.dataset.theme = 'light';
    }
  </script>
  <script src="assets/js/app.js?v=1.3.0" defer></script>
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="identity" aria-label="little viewer">
        <span class="mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" fill="none"><path d="m12 9-7 7 7 7m8-14 7 7-7 7" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
        <span class="wordmark">little viewer</span>
      </div>
      <button id="themeButton" class="icon-button" type="button" aria-label="Toggle color theme" title="Toggle color theme">
        <svg class="moon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M20 15.2A8.5 8.5 0 0 1 8.8 4 8.5 8.5 0 1 0 20 15.2Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
        <svg class="sun" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="3.8" stroke="currentColor" stroke-width="1.7"/><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
      </button>
    </header>

    <main id="workspace" class="workspace" aria-label="HTML viewer">
      <div id="workspaceBar" class="workspace-bar" hidden>
        <div class="file-details"><span id="fileName" class="file-name" aria-live="polite"></span><span id="saveStatus" class="save-status" role="status" aria-live="polite" hidden></span></div>
        <div class="preview-actions">
          <button id="replaceButton" class="replace-button" type="button" aria-label="Upload another HTML file" title="Upload another HTML file">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 16V4m0 0L7.5 8.5M12 4l4.5 4.5M4.5 16.5v2.25c0 .69.56 1.25 1.25 1.25h12.5c.69 0 1.25-.56 1.25-1.25V16.5" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span>upload html</span>
          </button>
          <button id="fullscreenButton" class="icon-button" type="button" aria-label="Enter full screen" aria-pressed="false" title="Full screen">
            <svg class="enter-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <svg class="exit-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M3 8h5V3m13 5h-5V3M3 16h5v5m13-5h-5v5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
      </div>
      <div class="canvas">
        <div id="emptyState" class="empty-state">
          <h1 id="emptyTitle">hi there delilah ❀</h1>
          <p id="emptyDescription" class="subtitle">here's little html viewer<br>made exclusively just for you.</p>
          <button id="uploadButton" class="upload-button" type="button">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 16V4m0 0L7.5 8.5M12 4l4.5 4.5M4.5 16.5v2.25c0 .69.56 1.25 1.25 1.25h12.5c.69 0 1.25-.56 1.25-1.25V16.5" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span>upload html</span>
          </button>
          <p class="little-wish">semoga lancar UPKP nya<br>semoga diberikan hasil yang terbaik (:</p>
        </div>
        <iframe id="preview" title="Uploaded HTML preview" sandbox="allow-scripts" referrerpolicy="no-referrer" hidden></iframe>
      </div>
    </main>

    <input id="fileInput" type="file" accept=".html,.htm,text/html" hidden>
    <footer class="footer">
      <span>a little corner of the internet</span>
      <span id="version" class="version">v1.3.0</span>
    </footer>
  </div>
</body>
</html>
